<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Fygo TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#1d1d1f;color:#fff;font-family:Arial,sans-serif}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.box{text-align:center}.logo{font-size:46px;font-weight:700;font-style:italic;margin-bottom:22px}
.logo b{color:#1b8cff}.msg{font-size:24px;color:#bbb}.err{margin-top:12px;font-size:17px;color:#888}
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <div class="logo"><b>Fygo</b> TV</div>
  <div id="msg" class="msg">A carregar versão live…</div>
  <div id="err" class="err">Loader 0.7.0</div>
</div></div>
<script>
(function(){
  var RAW='https://raw.githubusercontent.com/DewDrop-99/SmartThingsPublic/fygotv-tizenbrew/app/live.html';
  var CDN='https://cdn.jsdelivr.net/gh/DewDrop-99/SmartThingsPublic@fygotv-tizenbrew/app/live.html';
  var CACHE='fygo_live_html_v2';
  var stamp=Date.now();

  function valid(html){
    return html && html.indexOf('<!doctype html>')>=0 && html.indexOf('FYGO_LIVE_APP')>=0;
  }
  function inject(html){
    if(!valid(html))throw Error('frontend live inválido');
    try{localStorage.setItem(CACHE,html)}catch(e){}
    document.open();document.write(html);document.close();
  }
  function xhr(url){
    return new Promise(function(resolve,reject){
      var x=new XMLHttpRequest();
      x.open('GET',url+(url.indexOf('?')>=0?'&':'?')+'_='+stamp,true);
      x.timeout=9000;
      x.onreadystatechange=function(){
        if(x.readyState===4){
          if(x.status>=200&&x.status<300)resolve(x.responseText);
          else reject(Error('HTTP '+x.status));
        }
      };
      x.onerror=function(){reject(Error('rede'))};
      x.ontimeout=function(){reject(Error('timeout'))};
      x.send();
    });
  }
  function cached(){
    var h='';try{h=localStorage.getItem(CACHE)||''}catch(e){}
    if(valid(h)){inject(h);return true}
    return false;
  }

  xhr(RAW).then(inject).catch(function(){
    return xhr(CDN).then(inject);
  }).catch(function(e){
    if(cached())return;
    document.getElementById('err').textContent='Sem acesso à versão live; a abrir cópia estável.';
    setTimeout(function(){window.location.replace('stable.html')},800);
  });
})();
</script>
</body>
</html>
