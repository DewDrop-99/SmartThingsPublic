<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,initial-scale=1">
<title>Fygo TV</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font:26px Arial,sans-serif;overflow:hidden}button,input,select{font:inherit}.hide{display:none!important}
.top{height:105px;display:flex;align-items:center;padding:0 55px;background:#10141c;border-bottom:1px solid #2b3340}.brand{font-size:40px;font-weight:700;color:#45a4ff}.brand b{color:#fff}.nav{margin-left:60px;display:flex;gap:15px}.nav button,.btn{background:#1d2531;color:#fff;border:2px solid transparent;border-radius:12px;padding:16px 25px}.nav button:focus,.btn:focus,input:focus,select:focus,.card:focus{outline:none;border-color:#65b8ff;box-shadow:0 0 0 4px #247acb}.server{margin-left:auto;color:#aab5c5;font-size:20px}
.screen{height:975px;padding:45px 60px;overflow:auto}.setup{display:flex;justify-content:center;padding-top:110px}.panel{width:900px;background:#141a23;padding:45px;border-radius:20px}.panel h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.field label{display:block;color:#aeb9c8;margin-bottom:8px}.field input,.field select{width:100%;padding:16px;background:#0d1118;color:#fff;border:2px solid #354154;border-radius:10px}.actions{display:flex;gap:20px;margin-top:30px}.primary{background:#198cff!important}.status{margin-top:20px;color:#b9c4d2}.err{color:#ff6d75}
h1{font-size:42px}.rail{display:flex;gap:22px;flex-wrap:wrap}.card{width:230px;background:#151b24;border:2px solid transparent;border-radius:14px;overflow:hidden;padding:0;color:#fff;text-align:left}.poster{height:320px;background:#232c39 center/cover no-repeat}.ct{padding:14px;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#9eabbc;padding:40px}
.detail{position:relative}.detail h1{font-size:58px;max-width:1100px}.overview{max-width:1100px;line-height:1.45;color:#d2d8e0}.facts{color:#9fb0c5;margin:15px 0 25px}.player{position:fixed;inset:0;background:#000;z-index:9;padding:0}.player video{width:100%;height:100%;background:#000}.hud{position:absolute;left:0;right:0;bottom:0;padding:45px 60px;background:linear-gradient(transparent,rgba(0,0,0,.9))}.search{display:flex;gap:15px}.search input{width:650px;padding:16px;background:#101722;color:#fff;border:2px solid #334154;border-radius:12px}
</style></head><body>
<div id="setup" class="screen setup"><div class="panel"><h1><span class="brand">Fygo <b>TV</b></span> para Samsung</h1><p>Cliente experimental para FygoOS através do TizenBrew.</p>
<div class="grid"><div class="field"><label>Protocolo</label><select id="protocol"><option>http</option><option>https</option></select></div><div class="field"><label>IP / hostname</label><input id="host" placeholder="NAS"></div><div class="field"><label>Porta</label><input id="port" value="5666"></div><div class="field"><label>Código de acesso (opcional)</label><input id="code"></div><div class="field"><label>Utilizador FygoOS</label><input id="username" autocomplete="username"></div><div class="field"><label>Palavra-passe</label><input id="password" type="password" autocomplete="current-password"></div></div>
<div class="actions"><button id="test" class="btn">Testar ligação</button><button id="save" class="btn primary">Guardar e entrar</button></div><div id="status" class="status"></div></div></div>
<div id="main" class="hide"><div class="top"><div class="brand">Fygo <b>TV</b></div><div class="nav"><button data-view="home">Início</button><button data-view="libs">Biblioteca</button><button data-view="search">Pesquisar</button><button data-view="settings">Definições</button></div><div id="server" class="server"></div></div><div id="content" class="screen"></div></div>
<div id="detail" class="screen detail hide"><button id="backDetail" class="btn">‹ Voltar</button><h1 id="dtitle"></h1><div id="dfacts" class="facts"></div><p id="dover" class="overview"></p><button id="play" class="btn primary">▶ Reproduzir</button></div>
<div id="player" class="player hide"><video id="video"></video><div class="hud"><div id="ptitle"></div><div id="perror" class="err"></div><div class="actions"><button id="rw" class="btn">−10 s</button><button id="pp" class="btn primary">Play/Pause</button><button id="ff" class="btn">+10 s</button><button id="closePlayer" class="btn">Voltar</button></div></div></div>
<script>
(function(){
var cfg={},libs=[],item=null,tempPassword='',LS='fygo_tb_cfg_v1',DEVLS='fygo_tb_device_v1',PROXY='http://127.0.0.1:8768/fygo';
function q(x){return document.getElementById(x)} function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){try{cfg=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){cfg={}};q('protocol').value=cfg.protocol||'http';q('host').value=cfg.host||'';q('port').value=cfg.port||'5666';q('code').value=cfg.code||'';q('username').value=cfg.username||'';q('password').value=''}
function read(){var oldToken=cfg.token||'';tempPassword=q('password').value;cfg={protocol:q('protocol').value,host:q('host').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,''),port:q('port').value.trim(),code:q('code').value.trim(),username:q('username').value.trim(),token:oldToken};return cfg}
function base(){return(cfg.protocol||'http')+'://'+cfg.host+(cfg.port?':'+cfg.port:'')}
function deviceId(){var d='';try{d=localStorage.getItem(DEVLS)||''}catch(e){}if(!d){d='tizen-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*0xFFFFFF).toString(36);try{localStorage.setItem(DEVLS,d)}catch(e){}}return d}
function proxyFetch(env,tries){return fetch(PROXY,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(env)}).catch(function(e){if(tries>0)return new Promise(function(resolve){setTimeout(resolve,350)}).then(function(){return proxyFetch(env,tries-1)});throw Error('Serviço Fygo local indisponível: '+(e&&e.message?e.message:'falha de ligação'))})}
function rawReq(path,opt){opt=opt||{};var method=(opt.method||'GET').toUpperCase(),bodyText=opt.body?JSON.stringify(opt.body):'';var env={protocol:cfg.protocol||'http',host:cfg.host,port:cfg.port,path:path,method:method,bodyText:bodyText,accessCode:cfg.code||'',deviceId:deviceId(),token:opt.noAuth?'':(cfg.token||''),hashPassword:opt.hashPassword===true};return proxyFetch(env,15).then(function(r){return r.text().then(function(t){var j;try{j=t?JSON.parse(t):{}}catch(e){throw Error('Resposta inválida do servidor (HTTP '+r.status+')')}if(!r.ok){var he=Error((j&&j.msg)||('HTTP '+r.status));he.httpStatus=r.status;throw he}if(j&&typeof j.code!=='undefined'&&[0,1,200].indexOf(j.code)<0){var er=Error(j.msg||('Código '+j.code));er.fygoCode=j.code;throw er}return j&&Object.prototype.hasOwnProperty.call(j,'data')?j.data:j})})}
function authErr(e){var m=String(e&&e.message||'').toLowerCase();return m.indexOf('auth')>=0||m.indexOf('token')>=0||m.indexOf('unauthor')>=0||m.indexOf('login')>=0}
function saveToken(d){var tok=d&&(d.token||d.access_token||d.authorization||d.auth);if(!tok&&typeof d==='string')tok=d;if(!tok)throw Error('O FygoOS não devolveu um token de sessão.');cfg.token=String(tok);localStorage.setItem(LS,JSON.stringify(cfg));return cfg.token}
function loginV1(){return rawReq('/v/api/v1/login',{method:'POST',noAuth:true,body:{username:cfg.username,password:tempPassword,app_name:'trimemedia-web'}}).then(saveToken)}
function login(){if(!cfg.username||!tempPassword)return Promise.reject(Error('Introduz o utilizador e a palavra-passe do FygoOS.'));return rawReq('/v/api/v2/user/loginByPassword',{method:'POST',noAuth:true,hashPassword:true,body:{username:cfg.username,password:tempPassword,app_name:'trimemedia-web'}}).then(saveToken).catch(function(e){var m=String(e&&e.message||'');if((e&&[404,405,501].indexOf(e.httpStatus)>=0)||/HTTP\s+(404|405|501)|not found|not implemented/i.test(m))return loginV1();throw e})}
function req(path,opt){opt=opt||{};return rawReq(path,opt).catch(function(e){if(!opt.noRetry&&path!=='/v/api/v1/login'&&authErr(e)&&cfg.username&&tempPassword){cfg.token='';return login().then(function(){var again={};for(var k in opt)again[k]=opt[k];again.noRetry=true;return rawReq(path,again)})}throw e})}
function arr(d){if(Array.isArray(d))return d;if(!d)return[];return d.list||d.items||d.data||[]}
function img(v){if(!v)return'';if(Array.isArray(v))v=v[0];if(typeof v==='string'&&(v[0]=='['||v[0]=='{'))try{var x=JSON.parse(v);v=Array.isArray(x)?x[0]:(x.url||'')}catch(e){};if(!v)return'';return /^https?:/.test(v)?v:base()+(v[0]=='/'?'':'/')+v}
function show(id){['setup','main','detail','player'].forEach(function(x){q(x).classList.toggle('hide',x!==id)})}
function status(s,e){q('status').textContent=s;q('status').className='status'+(e?' err':'')}
function test(enter){read();status('A ligar…');return rawReq('/v/api/v1/server/info',{noAuth:true}).then(function(info){if(!enter){status('Ligação ao servidor OK'+(info&&info.name?' — '+info.name:''));return info}status('A autenticar…');return (cfg.token?rawReq('/v/api/v1/user/info').catch(function(){cfg.token='';return login().then(function(){return rawReq('/v/api/v1/user/info')})}):login().then(function(){return rawReq('/v/api/v1/user/info')})).then(function(user){localStorage.setItem(LS,JSON.stringify(cfg));status('Autenticação OK'+(user&&user.username?' — '+user.username:''));enterMain(info);return info})}).catch(function(e){status(e.message,true);throw e})}
function enterMain(info){q('server').textContent=(info&&info.name)||cfg.host;show('main');home()}
function card(i){var p=img(i.posters||i.poster||i.cover||i.thumb);return '<button class="card" data-guid="'+esc(i.guid||i.GUID||'')+'"><div class="poster"'+(p?' style="background-image:url(&quot;'+esc(p)+'&quot;)"':'')+'></div><div class="ct">'+esc(i.title||i.tvTitle||i.name||'Sem título')+'</div></button>'}
function bindCards(){Array.prototype.forEach.call(document.querySelectorAll('.card'),function(c){c.onclick=function(){openDetail(c.getAttribute('data-guid'))}})}
function home(){q('content').innerHTML='<h1>Início</h1><div id="rows">A carregar…</div>';Promise.all([req('/v/api/v1/mediadb/list'),req('/v/api/v1/play/list').catch(function(){return[]})]).then(function(x){libs=arr(x[0]);var cont=arr(x[1]);var h='';if(cont.length)h+='<h2>Continuar a ver</h2><div class="rail">'+cont.slice(0,12).map(card).join('')+'</div>';h+='<h2>Bibliotecas</h2><div class="rail">'+libs.map(function(l){return '<button class="btn lib" data-guid="'+esc(l.guid||'')+'">'+esc(l.title||l.name||l.category||'Biblioteca')+'</button>'}).join('')+'</div>';q('rows').innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll('.lib'),function(b){b.onclick=function(){openLib(libs.filter(function(l){return String(l.guid)===b.getAttribute('data-guid')})[0])}});bindCards()}).catch(function(e){q('rows').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})}
function libsView(){q('content').innerHTML='<h1>Biblioteca</h1><div class="rail">'+libs.map(function(l){return '<button class="btn lib" data-guid="'+esc(l.guid||'')+'">'+esc(l.title||l.name||l.category||'Biblioteca')+'</button>'}).join('')+'</div>';Array.prototype.forEach.call(document.querySelectorAll('.lib'),function(b){b.onclick=function(){openLib(libs.filter(function(l){return String(l.guid)===b.getAttribute('data-guid')})[0])}})}
function openLib(l){q('content').innerHTML='<h1>'+esc(l&&l.title||'Biblioteca')+'</h1><div id="list">A carregar…</div>';var g=l&&l.guid||'';req('/v/api/v1/item/list',{method:'POST',body:{ancestorGUID:g,parentGuid:g,page:1,pageSize:100,sortColumn:'title',sortType:'asc',excludeFolder:0,excludeGroupedVideo:0}}).then(function(d){var a=arr(d);q('list').innerHTML=a.length?'<div class="rail">'+a.map(card).join('')+'</div>':'<div class="empty">Sem conteúdos.</div>';bindCards()}).catch(function(e){q('list').innerHTML='<div class="err">'+esc(e.message)+'</div>'})}
function searchView(){q('content').innerHTML='<h1>Pesquisar</h1><div class="search"><input id="sq" placeholder="Filme, série…"><button id="go" class="btn primary">Pesquisar</button></div><div id="sr"></div>';q('go').onclick=function(){var s=q('sq').value.trim();if(!s)return;q('sr').innerHTML='A procurar…';req('/v/api/v1/search/list?q='+encodeURIComponent(s)).then(function(d){var a=arr(d);q('sr').innerHTML='<div class="rail">'+a.map(card).join('')+'</div>';bindCards()}).catch(function(e){q('sr').innerHTML='<div class="err">'+esc(e.message)+'</div>'})};q('sq').focus()}
function openDetail(g){show('detail');q('dtitle').textContent='A carregar…';req('/v/api/v1/item/'+encodeURIComponent(g)).then(function(i){item=i||{};q('dtitle').textContent=i.title||i.tvTitle||'Sem título';q('dover').textContent=i.overview||'';q('dfacts').textContent=(i.releaseDate?String(i.releaseDate).slice(0,4)+'  ':'')+(i.runtime?Math.round(i.runtime/60)+' min':'')}).catch(function(e){q('dtitle').textContent='Erro';q('dover').textContent=e.message})}
function play(){if(!item)return;show('player');q('ptitle').textContent=item.title||item.tvTitle||'';q('perror').textContent='A preparar…';var b={guid:item.playItemGuid||item.guid||'',mediaGuid:item.mediaGUID||item.mediaGuid||'',videoGuid:item.videoGUID||item.videoGuid||'',audioGuid:item.audioGUID||item.audioGuid||'',subtitleGuid:item.subtitleGUID||item.subtitleGuid||''};req('/v/api/v1/play/info',{method:'POST',body:b}).then(function(i){return req('/v/api/v1/play/play',{method:'POST',body:{mediaGUID:i.mediaGUID||'',videoGUID:i.videoGUID||'',audioGUID:i.audioGUID||'',subtitleGUID:i.subtitleGUID||'',startTimestamp:i.ts||0,bitrate:0,resolution:'',forcedSDR:0,withoutStream:false}})}).then(function(p){var u=p&&(p.playLink||p.url||p.link);if(!u)throw Error('O FygoOS não devolveu playLink');if(!/^https?:/.test(u))u=base()+(u[0]=='/'?'':'/')+u;q('perror').textContent='';var v=q('video');v.src=u;v.play()}).catch(function(e){q('perror').textContent=e.message})}
function closePlayer(){var v=q('video');try{v.pause();v.removeAttribute('src');v.load()}catch(e){};show('detail')}
q('protocol').onchange=function(){q('port').value=q('protocol').value==='https'?'5667':'5666'};q('test').onclick=function(){test(false)};q('save').onclick=function(){test(true)};q('backDetail').onclick=function(){show('main')};q('play').onclick=play;q('closePlayer').onclick=closePlayer;q('pp').onclick=function(){var v=q('video');v.paused?v.play():v.pause()};q('rw').onclick=function(){q('video').currentTime=Math.max(0,q('video').currentTime-10)};q('ff').onclick=function(){q('video').currentTime+=10};
Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){var v=b.getAttribute('data-view');if(v==='home')home();else if(v==='libs'){if(libs.length)libsView();else req('/v/api/v1/mediadb/list').then(function(d){libs=arr(d);libsView()})}else if(v==='search')searchView();else{load();show('setup')}}});
function focusables(){return Array.prototype.slice.call(document.querySelectorAll('button,input,select,[tabindex]')).filter(function(el){if(el.disabled||el.tabIndex<0)return false;var p=el;while(p){if(p.classList&&p.classList.contains('hide'))return false;p=p.parentElement}var r=el.getBoundingClientRect();return r.width>0&&r.height>0})}
function firstFocus(){var a=focusables();if(a.length)setTimeout(function(){try{a[0].focus()}catch(e){}},60)}
function moveFocus(dir){var a=focusables(),c=document.activeElement;if(!a.length)return;if(a.indexOf(c)<0){a[0].focus();return}var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,score=1e12;a.forEach(function(el){if(el===c)return;var x=el.getBoundingClientRect(),ex=x.left+x.width/2,ey=x.top+x.height/2,dx=ex-cx,dy=ey-cy;if((dir==='l'&&dx>=-2)||(dir==='r'&&dx<=2)||(dir==='u'&&dy>=-2)||(dir==='d'&&dy<=2))return;var primary=(dir==='l'||dir==='r')?Math.abs(dx):Math.abs(dy),secondary=(dir==='l'||dir==='r')?Math.abs(dy):Math.abs(dx),sc=primary+secondary*2.2;if(sc<score){score=sc;best=el}});if(best){best.focus();try{best.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){best.scrollIntoView(false)}}}
function remoteKey(e){var k=e.keyCode||e.which;if(k===37||k===38||k===39||k===40){var tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'&&(k===37||k===39))return;e.preventDefault();moveFocus(k===37?'l':k===38?'u':k===39?'r':'d');return}if(k===13){var a=document.activeElement;if(a&&a.click&&a.tagName!=='INPUT'&&a.tagName!=='SELECT'){e.preventDefault();a.click()}return}if(k===10009||e.key==='Backspace'){e.preventDefault();if(!q('player').classList.contains('hide'))closePlayer();else if(!q('detail').classList.contains('hide')){show('main');firstFocus()}else if(!q('setup').classList.contains('hide')){try{window.history.back()}catch(x){}}return}if(k===10252&&!q('player').classList.contains('hide'))q('pp').click();else if(k===412&&!q('player').classList.contains('hide'))q('rw').click();else if(k===417&&!q('player').classList.contains('hide'))q('ff').click()}
window.addEventListener('keydown',remoteKey,true);
load();if(cfg.host&&cfg.token){show('setup');test(true).then(firstFocus).catch(firstFocus)}else{show('setup');firstFocus()}
})();
</script></body></html>
