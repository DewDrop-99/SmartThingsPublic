<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Fygo TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#1d1d1f;color:#fff;font-family:Arial,sans-serif}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.box{text-align:center}
.logo{font-size:46px;font-weight:700;font-style:italic;margin-bottom:22px}
.logo b{color:#1b8cff}
.msg{font-size:24px;color:#bbb}
.err{margin-top:12px;font-size:17px;color:#888}
</style>
</head>
<body>
<div class="wrap"><div class="box">
  <div class="logo"><b>Fygo</b> TV</div>
  <div id="msg" class="msg">A atualizar…</div>
  <div id="err" class="err"></div>
</div></div>
<script>
(function(){
  var OWNER='DewDrop-99';
  var REPO='SmartThingsPublic';
  var BRANCH='fygotv-tizenbrew';
  var KEY='fygo_live_sha_v1';
  var stamp=Date.now();

  function text(url){
    return fetch(url,{headers:{'Accept':'text/plain,*/*'}}).then(function(r){
      if(!r.ok)throw Error('HTTP '+r.status);
      return r.text();
    });
  }

  function loadHtml(html,sha){
    if(!html||html.indexOf('<html')<0)throw Error('frontend inválido');
    try{if(sha)localStorage.setItem(KEY,sha)}catch(e){}
    document.open();
    document.write(html);
    document.close();
  }

  function fromSha(sha){
    var url='https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@'+sha+'/app/live.html?_='+stamp;
    return text(url).then(function(html){loadHtml(html,sha)});
  }

  function latest(){
    var api='https://api.github.com/repos/'+OWNER+'/'+REPO+'/commits/'+BRANCH+'?_='+stamp;
    return fetch(api,{headers:{'Accept':'application/vnd.github+json'}}).then(function(r){
      if(!r.ok)throw Error('GitHub HTTP '+r.status);
      return r.json();
    }).then(function(j){
      if(!j||!j.sha)throw Error('SHA indisponível');
      return fromSha(j.sha);
    });
  }

  function oldSha(){
    var sha='';
    try{sha=localStorage.getItem(KEY)||''}catch(e){}
    return sha?fromSha(sha):Promise.reject(Error('sem versão em cache'));
  }

  latest().catch(function(e1){
    document.getElementById('err').textContent='A usar a última versão disponível…';
    return oldSha().catch(function(e2){
      // Last-resort bundled copy from the same installed module.
      window.location.replace('stable.html');
    });
  });
})();
</script>
</body>
</html>
