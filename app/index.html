<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fygo TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090a;color:#f5f5f6;font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
#stage{position:absolute;width:1920px;height:1080px;left:0;top:0;transform-origin:0 0;background:#1f1f21;overflow:hidden}
.focusable,.posterCard,.libraryCard,.statCard,.libraryTab{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.focusable:focus,.posterCard:focus,.libraryCard:focus,.statCard:focus,.libraryTab:focus,input:focus,select:focus{
 outline:none;box-shadow:0 0 0 5px #0b7cff,0 0 25px rgba(11,124,255,.45);transform:scale(1.035);z-index:15
}
svg{display:block}
.iconSvg{width:100%;height:100%}
.logoSvg{width:270px;height:72px}
#setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1d1d1f}
.setupPanel{width:920px;padding:48px 56px;background:#29292c;border-radius:25px;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.setupPanel .brand{margin-bottom:14px}.setupSub{font-size:24px;color:#b7b7bb;margin-bottom:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
.field label{display:block;font-size:20px;color:#bbbcc0;margin-bottom:8px}
.field input,.field select{width:100%;height:60px;border:2px solid #45454a;border-radius:12px;background:#171719;padding:0 17px}
.actions{display:flex;gap:18px;margin-top:30px}
.primary,.secondary{height:62px;border:0;border-radius:16px;padding:0 30px;font-weight:700}
.primary{background:#087dff}.secondary{background:#3a3a3e}
.status{font-size:20px;color:#c8c8cb;min-height:28px;margin-top:18px}.err{color:#ff6d75}

#app{position:absolute;inset:0;background:#1f1f21}
.topbar{position:absolute;left:0;right:0;top:0;height:116px;padding:30px 78px 10px;display:flex;align-items:center}
.topSearch{margin-left:auto;width:64px;height:64px;border:0;border-radius:50%;background:transparent;padding:10px}
.mainScroll{position:absolute;left:0;right:0;top:116px;bottom:116px;overflow-y:auto;overflow-x:hidden;padding:5px 78px 52px}
.mainScroll::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.heroRow{display:flex;align-items:flex-start;gap:30px;margin-top:8px}
.libraryCard{width:360px;height:172px;border:3px solid #55565b;border-radius:20px;background:#27272a;overflow:hidden;padding:0;position:relative;flex:0 0 360px}
.libraryCollage{height:125px;display:flex;background:#111}
.libraryCollage img{width:120px;height:125px;object-fit:cover}
.libraryCollage .ph{width:120px;height:125px;background:#303036}
.libraryName{position:absolute;left:0;right:0;bottom:0;height:55px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700;background:linear-gradient(transparent,rgba(23,23,25,.97) 36%)}
.stats{display:flex;gap:22px;flex:1;overflow:hidden}
.statCard{height:128px;min-width:244px;flex:1;border:0;border-radius:21px;padding:0 22px;text-align:center;position:relative;overflow:hidden;background:#353740}
.statCard:nth-child(2){background:#382f3d}.statCard:nth-child(3){background:#2c3b3c}.statCard:nth-child(4){background:#383238}
.statCard .decor{position:absolute;width:120px;height:120px;right:-15px;bottom:-24px;opacity:.12}
.statName{font-size:26px;position:relative}.statValue{font-size:28px;font-weight:700;margin-top:8px;position:relative}
.sectionHead{display:flex;align-items:center;font-size:31px;font-weight:700;margin:32px 0 14px}
.sectionHead .arrow{font-size:40px;margin-left:11px;color:#dadade}
.rail{display:flex;gap:22px;overflow-x:auto;overflow-y:visible;padding:8px 5px 23px}
.posterCard{width:228px;flex:0 0 228px;border:0;background:transparent;text-align:left;padding:0;border-radius:16px}
.posterImg{width:228px;height:342px;border:1px solid #5a5b61;border-radius:15px;background:#303035 center/cover no-repeat;position:relative;overflow:hidden}
.score{position:absolute;left:8px;top:8px;padding:5px 8px;border-radius:7px;background:rgba(10,10,11,.82);color:#e9df20;font-size:18px}
.posterFlag{position:absolute;right:8px;bottom:8px;font-size:17px;font-weight:800;background:rgba(210,210,212,.88);color:#2c2c2e;border-radius:5px;padding:3px 7px}
.cardTitle{font-size:24px;font-weight:700;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardMeta{font-size:21px;color:#b9b9bd;margin-top:7px}
.bottomNav{position:absolute;left:0;right:0;bottom:0;height:116px;background:#1f1f21;border-top:1px solid #2a2a2e;display:flex;align-items:center;justify-content:center;gap:175px}
.navBtn{width:180px;height:88px;border:0;border-radius:15px;background:transparent;color:#b9b9bd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:19px;font-weight:700}
.navBtn.active{color:#fff}.navIcon{width:35px;height:35px}.avatar{width:36px;height:36px;border-radius:50%;background:#ffb08b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}

#detail{position:absolute;inset:0;background:#202023;overflow:hidden}
.detailBackdrop{position:absolute;left:0;top:0;right:0;height:720px;background:#29292d center/cover no-repeat}
.detailBackdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(31,31,33,.05) 26%,rgba(31,31,33,.42) 62%,#202023 100%)}
.detailTop{position:absolute;z-index:4;left:55px;right:55px;top:36px;display:flex;justify-content:space-between}
.roundBtn{width:64px;height:64px;border:0;border-radius:50%;background:rgba(33,33,36,.64);padding:13px}
.detailScroll{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;padding:390px 78px 70px;z-index:3}
.detailTitle{font-size:52px;line-height:1.05;font-weight:800;margin:0 0 11px;max-width:1250px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.meta{font-size:25px;line-height:1.42;color:#d0d0d3;max-width:1320px}
.rating{color:#e6d623}
.streamLine{display:flex;align-items:center;gap:26px;min-height:45px;margin-top:14px;flex-wrap:wrap}
.streamText{font-size:24px;font-weight:700}
.techBadge{height:34px;display:inline-flex;align-items:center;padding:0 10px;border:2px solid #aaa;border-radius:5px;color:#cfcfd2;font-size:19px;font-weight:800}
.detailProgress{display:flex;align-items:center;gap:18px;width:790px;margin-top:19px}
.progressTrack{height:10px;flex:1;border-radius:7px;background:#55565a;overflow:hidden}.progressFill{height:100%;width:0;background:#087dff}
.progressText{font-size:22px;color:#c7c7ca}
.detailActions{display:flex;align-items:center;gap:22px;margin:27px 0 26px}
.playBig{height:82px;min-width:330px;padding:0 45px;border:0;border-radius:45px;background:#087dff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:15px}
.actionCircle{width:82px;height:82px;border:1px solid #5b5c61;border-radius:50%;background:#37373a;padding:20px}
.actionCircle.on{border-color:#087dff;background:#263d58}
.qualityLine{display:flex;gap:15px;margin:3px 0 29px}.qualityChip{border:3px solid #087dff;color:#087dff;background:#29292c;border-radius:9px;padding:13px 24px;font-size:24px;font-weight:700}
.overview{font-size:25px;line-height:1.45;color:#d1d1d4;max-width:1320px}
.castTitle{font-size:29px;font-weight:800;margin:30px 0 17px}.castRail{display:flex;gap:28px}.castPerson{width:130px;text-align:center}.castPhoto{width:116px;height:116px;border-radius:50%;background:#3a3a3e center/cover no-repeat;margin:0 auto 8px}.castName{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detailMenu{position:absolute;right:58px;top:110px;width:330px;padding:14px;background:#303034;border-radius:15px;z-index:20;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.menuBtn{width:100%;height:60px;background:transparent;border:0;border-radius:10px;text-align:left;padding:0 18px;font-size:21px}.menuBtn:focus{background:#087dff;outline:none}

#player{position:absolute;inset:0;background:#000;z-index:40}
#video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.playerHud{position:absolute;left:0;right:0;bottom:0;padding:115px 72px 42px;background:linear-gradient(transparent,rgba(0,0,0,.93));z-index:3}
.playerTitle{font-size:31px;font-weight:700;margin-bottom:17px}
.playerTimeline{display:flex;align-items:center;gap:15px}.playerTime{width:88px;font-size:19px;color:#e3e3e5}.playerBar{height:8px;background:#66676b;border-radius:8px;flex:1;overflow:hidden}.playerBarFill{height:100%;width:0;background:#087dff}
.playerControls{display:flex;align-items:center;gap:17px;margin-top:16px}.playerBtn{height:58px;min-width:74px;border:0;border-radius:13px;background:#222225;padding:12px 20px}.playerBtn img,.playerBtn svg{height:34px;width:auto;margin:auto}
.playerBtn.primaryCtl{background:#087dff}.playerError{font-size:21px;color:#ff6c74;margin:10px 0}
.settingsBox{background:#2b2b2f;border-radius:20px;padding:28px;max-width:900px}.settingsBox h2{margin-top:0}
.libraryTabs{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:25px}.libraryTab{height:60px;border:0;border-radius:14px;background:#35353a;padding:0 24px}
.searchLine{display:flex;gap:16px;margin:10px 0 28px}.searchLine input{width:760px;height:65px;background:#29292d;border:2px solid #4c4c51;border-radius:14px;padding:0 18px;font-size:25px}
.empty{font-size:23px;color:#aaa;padding:35px 0}
</style>

<style id="tizen4-compat">
/* Tizen 4 / old Chromium: use viewport geometry directly.
   Do not scale a virtual 1920x1080 canvas: TizenBrew already maps its webview to the TV. */
#stage{left:0!important;top:0!important;width:100vw!important;height:100vh!important;transform:none!important}
.topbar{height:10.5vh!important;padding:2.5vh 4vw 1vh!important}
.logoSvg{width:15vw!important;height:6.7vh!important}
.topSearch{width:4vw!important;height:4vw!important;padding:.55vw!important}
.mainScroll{top:10.5vh!important;bottom:10.8vh!important;padding:.5vh 4vw 4vh!important}
.heroRow{display:-webkit-box!important;display:flex!important;width:100%!important;margin-top:.8vh!important}
.libraryCard{display:block!important;width:19vw!important;min-width:19vw!important;max-width:19vw!important;height:17vh!important;min-height:17vh!important;margin-right:1.5vw!important;border-width:3px!important;border-radius:1.1vw!important}
.libraryCollage{display:-webkit-box!important;display:flex!important;width:100%!important;height:12.5vh!important}
.libraryCollage img,.libraryCollage .ph{display:block!important;width:6.33vw!important;min-width:6.33vw!important;height:12.5vh!important;object-fit:cover!important}
.libraryName{height:5.4vh!important;font-size:1.45vw!important}
.stats{display:-webkit-box!important;display:flex!important;width:75vw!important;overflow:hidden!important}
.statCard{display:block!important;width:13.5vw!important;min-width:13.5vw!important;max-width:13.5vw!important;height:12.5vh!important;margin-right:1.15vw!important;border-radius:1.1vw!important}
.statName{font-size:1.32vw!important}.statValue{font-size:1.42vw!important;margin-top:.7vh!important}
.sectionHead{font-size:1.6vw!important;margin:2.3vh 0 1.3vh!important}
.sectionHead .arrow{font-size:2vw!important;margin-left:.55vw!important}
.rail{display:-webkit-box!important;display:flex!important;padding:.6vh .3vw 2vh!important;overflow-x:auto!important}
.posterCard{display:block!important;width:12vw!important;min-width:12vw!important;max-width:12vw!important;margin-right:1.15vw!important;border-radius:.8vw!important}
.posterImg{width:12vw!important;height:31.6vh!important;border-radius:.8vw!important}
.score{left:.45vw!important;top:.7vh!important;font-size:.9vw!important;padding:.45vh .4vw!important}
.posterFlag{right:.4vw!important;bottom:.6vh!important;font-size:.86vw!important;padding:.3vh .38vw!important}
.cardTitle{font-size:1.22vw!important;margin-top:.9vh!important}.cardMeta{font-size:1.05vw!important;margin-top:.45vh!important}
.bottomNav{height:10.8vh!important;display:-webkit-box!important;display:flex!important}
.navBtn{width:9.5vw!important;height:8.2vh!important;margin:0 4.2vw!important;font-size:.95vw!important}
.navIcon{width:1.9vw!important;height:1.9vw!important}.avatar{width:1.9vw!important;height:1.9vw!important;font-size:.9vw!important}

/* Detail screen */
.detailBackdrop{height:67vh!important}
.detailTop{left:2.9vw!important;right:2.9vw!important;top:3.2vh!important}
.roundBtn{width:3.4vw!important;height:3.4vw!important;padding:.65vw!important}
.detailScroll{padding:36vh 4vw 6vh!important}
.detailTitle{font-size:2.8vw!important;max-width:67vw!important;margin-bottom:1vh!important}
.meta{font-size:1.28vw!important;max-width:70vw!important}
.streamLine{margin-top:1.2vh!important;min-height:4vh!important}
.streamText{font-size:1.2vw!important;margin-right:1.25vw!important}
.techBadge{height:3.2vh!important;padding:0 .5vw!important;font-size:.95vw!important;margin-right:.5vw!important}
.detailProgress{width:42vw!important;margin-top:1.5vh!important}
.progressText{font-size:1.1vw!important}
.detailActions{margin:2.1vh 0!important}
.playBig{height:7.6vh!important;min-width:17vw!important;padding:0 2.2vw!important;border-radius:4vh!important;font-size:1.48vw!important;margin-right:1.1vw!important}
.actionCircle{width:4.3vw!important;height:4.3vw!important;padding:1.05vw!important;margin-right:.8vw!important}
.qualityLine{margin:0 0 2.2vh!important}.qualityChip{font-size:1.18vw!important;padding:1vh 1.25vw!important}
.overview{font-size:1.25vw!important;max-width:70vw!important;line-height:1.42!important}
.castTitle{font-size:1.48vw!important;margin:2.4vh 0 1.3vh!important}
.castPerson{width:6.8vw!important;margin-right:1.45vw!important}.castPhoto{width:6vw!important;height:6vw!important}.castName{font-size:.9vw!important}
#detailMenu{right:3vw!important;top:10vh!important;width:18vw!important}
.menuBtn{height:5.5vh!important;font-size:1.05vw!important}

/* Player */
.playerHud{padding:10vh 3.8vw 3.5vh!important}
.playerTitle{font-size:1.55vw!important;margin-bottom:1.4vh!important}
.playerTime{width:4.7vw!important;font-size:.95vw!important}
.playerControls{margin-top:1.3vh!important}
.playerBtn{height:5.5vh!important;min-width:4vw!important;padding:1vh 1vw!important;margin-right:.8vw!important}
.playerError{font-size:1.05vw!important}
.searchLine input{width:40vw!important;height:6vh!important;font-size:1.25vw!important}
.libraryTab{height:5.6vh!important;margin-right:.75vw!important;padding:0 1.2vw!important}
.settingsBox{max-width:48vw!important;padding:2.3vh 1.6vw!important}
</style>
</head>
<body>
<div id="stage">

<div id="setup">
 <div class="setupPanel">
  <div class="brand"><svg class="logoSvg" viewBox="0 0 300 80" aria-label="Fygo TV"><g fill="#147df5"><path d="M11 21h44l-5 13H6z"/><path d="M16 8h12l-6 13H10zM35 8h12l-6 13H29zM54 8h12l-6 13H48z"/><path d="M8 37h45v21c0 9-8 16-17 16H25C16 74 8 67 8 58z"/></g><circle cx="31" cy="55" r="12" fill="#147df5"/><path d="M28 48l11 7-11 7z" fill="#fff"/><text x="78" y="57" fill="#f4f4f5" font-size="45" font-style="italic" font-weight="600" font-family="Arial">Fygo TV</text></svg></div>
  <div class="setupSub">Ligação ao FygoOS</div>
  <div class="grid">
   <div class="field"><label>Protocolo</label><select id="protocol"><option>http</option><option>https</option></select></div>
   <div class="field"><label>IP / hostname</label><input id="host" placeholder="NAS"></div>
   <div class="field"><label>Porta</label><input id="port" value="5666"></div>
   <div class="field"><label>Código de acesso (opcional)</label><input id="code"></div>
   <div class="field"><label>Utilizador FygoOS</label><input id="username"></div>
   <div class="field"><label>Palavra-passe</label><input id="password" type="password"></div>
  </div>
  <div class="actions"><button id="test" class="secondary focusable">Testar ligação</button><button id="save" class="primary focusable">Guardar e entrar</button></div>
  <div id="status" class="status"></div>
 </div>
</div>

<div id="app" class="hide">
 <div class="topbar"><div class="brand"><svg class="logoSvg" viewBox="0 0 300 80" aria-label="Fygo TV"><g fill="#147df5"><path d="M11 21h44l-5 13H6z"/><path d="M16 8h12l-6 13H10zM35 8h12l-6 13H29zM54 8h12l-6 13H48z"/><path d="M8 37h45v21c0 9-8 16-17 16H25C16 74 8 67 8 58z"/></g><circle cx="31" cy="55" r="12" fill="#147df5"/><path d="M28 48l11 7-11 7z" fill="#fff"/><text x="78" y="57" fill="#f4f4f5" font-size="45" font-style="italic" font-weight="600" font-family="Arial">Fygo TV</text></svg></div><button id="topSearch" class="topSearch focusable" aria-label="Pesquisar"><svg class="iconSvg" viewBox="0 0 64 64"><circle cx="28" cy="27" r="17" fill="none" stroke="#fff" stroke-width="5"/><path d="M41 40l13 13" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
 <div id="mainScroll" class="mainScroll"></div>
 <div class="bottomNav">
  <button class="navBtn focusable active" data-nav="home"><span class="navIcon"><svg class="iconSvg" viewBox="0 0 48 48"><path d="M8 22L24 8l16 14v18H29V28H19v12H8z" fill="currentColor"/></svg></span><span>Home</span></button>
  <button class="navBtn focusable" data-nav="library"><span class="navIcon"><svg class="iconSvg" viewBox="0 0 48 48"><path d="M7 13h12l4 4h18v24H7z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></span><span>Library</span></button>
  <button class="navBtn focusable" data-nav="me"><span class="avatar">M</span><span>Me</span></button>
 </div>
</div>

<div id="detail" class="hide">
 <div id="detailBackdrop" class="detailBackdrop"></div>
 <div class="detailTop"><button id="detailBack" class="roundBtn focusable" aria-label="Voltar"><svg class="iconSvg" viewBox="0 0 64 64"><path d="M39 14L21 32l18 18M22 32h29" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="moreBtn" class="roundBtn focusable" aria-label="Mais"><svg class="iconSvg" viewBox="0 0 64 64"><circle cx="17" cy="32" r="4.5" fill="#fff"/><circle cx="32" cy="32" r="4.5" fill="#fff"/><circle cx="47" cy="32" r="4.5" fill="#fff"/></svg></button></div>
 <div id="detailMenu" class="hide"><button id="menuFavorite" class="menuBtn focusable"></button><button id="menuWatched" class="menuBtn focusable"></button></div>
 <div id="detailScroll" class="detailScroll">
  <h1 id="detailTitle" class="detailTitle"></h1>
  <div id="detailMeta" class="meta"></div>
  <div id="streamLine" class="streamLine"></div>
  <div id="detailProgress" class="detailProgress hide"><div class="progressTrack"><div id="detailProgressFill" class="progressFill"></div></div><div id="detailProgressText" class="progressText"></div></div>
  <div class="detailActions">
   <button id="playBig" class="playBig focusable"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#fff"/><path d="M17 12l13 8-13 8z" fill="#087dff"/></svg><span id="playLabel">Play</span></button>
   <button id="favoriteBtn" class="actionCircle focusable" aria-label="Favorito"><svg class="iconSvg" viewBox="0 0 64 64"><path d="M32 52C14 42 9 31 13 22c4-9 16-10 19-2 4-8 16-7 19 2 4 10-2 20-19 30z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/></svg></button>
   <button id="watchedBtn" class="actionCircle focusable" aria-label="Visto"><svg class="iconSvg" viewBox="0 0 64 64"><path d="M7 32c7-11 15-16 25-16s18 5 25 16c-7 11-15 16-25 16S14 43 7 32z" fill="none" stroke="#fff" stroke-width="4"/><circle cx="32" cy="32" r="8" fill="none" stroke="#fff" stroke-width="4"/><path d="M50 48l7 7" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></button>
  </div>
  <div id="qualityLine" class="qualityLine"></div>
  <div id="overview" class="overview"></div>
  <div id="castBlock" class="hide"><div class="castTitle">Cast &amp; Crew</div><div id="castRail" class="castRail"></div></div>
 </div>
</div>

<div id="player" class="hide">
 <video id="video" playsinline></video>
 <div id="playerHud" class="playerHud">
  <div id="playerTitle" class="playerTitle"></div>
  <div id="playerError" class="playerError"></div>
  <div class="playerTimeline"><span id="playerNow" class="playerTime">00:00</span><div class="playerBar"><div id="playerBarFill" class="playerBarFill"></div></div><span id="playerDur" class="playerTime">00:00</span></div>
  <div class="playerControls">
   <button id="rew" class="playerBtn focusable" aria-label="-10 segundos"><svg viewBox="0 0 64 44"><path d="M30 8L12 22l18 14zM52 8L34 22l18 14z" fill="#fff"/></svg></button>
   <button id="pause" class="playerBtn primaryCtl focusable" aria-label="Play/Pause"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="#fff" stroke-width="3"/><rect x="17" y="15" width="6" height="18" rx="2" fill="#fff"/><rect x="27" y="15" width="6" height="18" rx="2" fill="#fff"/></svg></button>
   <button id="fwd" class="playerBtn focusable" aria-label="+10 segundos"><svg viewBox="0 0 64 44"><path d="M12 8l18 14-18 14zM34 8l18 14-18 14z" fill="#fff"/></svg></button>
   <button id="playerBack" class="playerBtn focusable">Voltar</button>
  </div>
 </div>

function renderHome(){var first=libraries[0],f=filteredItems(),h='<div class="heroRow">';if(first)h+='<button id="libCard" class="libraryCard">'+collage(items)+'<div class="libraryName">'+esc(first.title||first.name||'Filmes')+'</div></button>';h+='<div class="stats">';['All','Movies','TV Shows','Videos'].forEach(function(n){var v=n==='All'?items.length:typeCount(n);h+='<button class="statCard" data-filter="'+n+'">'+statSvg(n)+'<div class="statName">'+n+'</div><div class="statValue">'+v+'</div></button>'});h+='</div></div><div class="sectionHead">'+esc(first&&first.title||'Filmes')+' <span class="arrow">›</span></div>';h+=f.length?'<div class="rail">'+f.map(card).join('')+'</div>':'<div class="empty">Sem conteúdos nesta categoria.</div>';q('mainScroll').innerHTML=h;if(q('libCard'))q('libCard').onclick=function(){libraryView(first)};Array.prototype.forEach.call(document.querySelectorAll('.statCard'),function(b){b.onclick=function(){activeFilter=b.getAttribute('data-filter');renderHome();focusFirst()}});bindCards();focusFirst()}
function homeView(){lastView='home';activeFilter='All';setNav('home');q('mainScroll').innerHTML='<div class="empty">A carregar…</div>';rawReq('/v/api/v1/mediadb/list').then(function(d){libraries=arr(d);return libraries[0]?loadItems(libraries[0],100):[]}).then(function(a){items=a;renderHome()}).catch(function(e){q('mainScroll').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})}

function searchView(){lastView='search';setNav('');q('mainScroll').innerHTML='<div class="sectionHead">Search</div><div class="searchLine"><input id="searchInput" placeholder="Filme, série…"><button id="searchGo" class="primary focusable">Pesquisar</button></div><div id="searchResults"></div>';q('searchGo').onclick=function(){var s=q('searchInput').value.trim();if(!s)return;q('searchResults').innerHTML='<div class="empty">A procurar…</div>';rawReq('/v/api/v1/search/list?q='+encodeURIComponent(s)).then(function(d){var a=arr(d);items=a;q('searchResults').innerHTML=a.length?'<div class="rail" style="flex-wrap:wrap;overflow:visible">'+a.map(card).join('')+'</div>':'<div class="empty">Sem resultados.</div>';bindCards()}).catch(function(e){q('searchResults').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})};setTimeout(function(){q('searchInput').focus()},70)}

function mergeItem(base,extra){var o={},k;for(k in base)o[k]=base[k];for(k in extra)o[k]=extra[k];return o}
function openDetail(g){var base={guid:g};for(var i=0;i<items.length;i++)if(guidOf(items[i])===g){base=items[i];break}currentItem=base;currentPlay=null;currentStreams=null;showOnly('detail');renderDetail();Promise.all([rawReq('/v/api/v1/item/'+encodeURIComponent(g)).catch(function(){return{}}),rawReq('/v/api/v1/play/info',{method:'POST',body:{item_guid:g}}).catch(function(){return{}}),rawReq('/v/api/v1/stream/list/'+encodeURIComponent(g)+'?before_play=1').catch(function(){return{}})]).then(function(r){currentPlay=r[1]||{};currentStreams=r[2]||{};currentItem=mergeItem(currentItem,r[0]||{});if(currentPlay.item)currentItem=mergeItem(currentItem,currentPlay.item);renderDetail();focusFirst()})}

function uniqueTitles(a){var out=[],seen={};for(var i=0;i<a.length;i++){var s=String(pick(a[i],['title','language','lan','codec_name'])||'').trim();if(s&&!seen[s]){seen[s]=1;out.push(s)}}return out}
function detectTech(){var v=currentStreams||{},vs=arr(v.video_streams||v.videoStreams),as=arr(v.audio_streams||v.audioStreams),h='';var vi=vs[0]||{};var w=num(pick(vi,['width'])),res=String(pick(vi,['resolution','height'])||'').toLowerCase(),dyn=String(pick(vi,['hdr','dynamic_range','color_transfer','color_trc','profile'])||'').toLowerCase();if(w>=3800||res.indexOf('2160')>=0||res.indexOf('4k')>=0)h+='<span class="techBadge">4K</span>';if(dyn.indexOf('hdr')>=0||dyn.indexOf('smpte2084')>=0)h+='<span class="techBadge">HDR</span>';var aud=JSON.stringify(as).toLowerCase();if(aud.indexOf('atmos')>=0||aud.indexOf('eac3')>=0||aud.indexOf('ac3')>=0||aud.indexOf('dolby')>=0)h+='<span class="techBadge">Dolby</span>';return h}
function renderDetail(){var i=currentItem||{},bp=backdropOf(i);q('detailBackdrop').style.backgroundImage=bp?'url("'+imageUrl(bp,1800)+'")':'none';q('detailTitle').textContent=titleOf(i);var sc=scoreOf(i),meta=[],year=yearOf(i),country=pick(i,['country','countries','production_countries']),genre=pick(i,['genres','genre']),rating=pick(i,['content_rating','certification']);if(Array.isArray(country))country=country.join(' · ');if(Array.isArray(genre))genre=genre.join(' · ');if(rating)meta.push(esc(rating));if(year)meta.push(esc(year));if(country)meta.push(esc(country));if(genre)meta.push(esc(genre));q('detailMeta').innerHTML=(sc?'<span class="rating">'+esc(sc)+'</span> &nbsp; ':'')+meta.join(' / ');var streams=currentStreams||{},aud=uniqueTitles(arr(streams.audio_streams)),sub=uniqueTitles(arr(streams.subtitle_streams));var line='';if(sub.length)line+='<span class="streamText">'+esc(sub[0])+' Subtitle⌄</span>';if(aud.length)line+='<span class="streamText">'+esc(aud[0])+' Audio⌄</span>';line+=detectTech();q('streamLine').innerHTML=line;var ts=num(pick(currentPlay,['ts']))||num(pick(i,['watched_ts','ts'])),total=num(pick(i,['duration','runtime']));if(ts>0&&total>0){q('detailProgress').classList.remove('hide');q('detailProgressFill').style.width=Math.min(100,ts/total*100)+'%';q('detailProgressText').textContent=formatTime(Math.max(0,total-ts))+' restantes';q('playLabel').textContent='Resume'}else{q('detailProgress').classList.add('hide');q('playLabel').textContent='Play'}var vi=arr(streams.video_streams)[0]||{},res=pick(vi,['resolution','height'])||'';q('qualityLine').innerHTML='<span class="qualityChip">'+esc(res?String(res)+' Original':'Original')+'</span>';q('overview').textContent=pick(i,['overview','plot','description'])||'';renderCast(i);setButtonStates()}

function toggleFavorite(){var fav=boolVal(currentItem,['is_favorite','favorite']),g=guidOf(currentItem);rawReq('/v/api/v1/item/favorite',{method:fav?'DELETE':'PUT',body:{item_guid:g}}).then(function(){currentItem.is_favorite=fav?0:1;setButtonStates();q('detailMenu').classList.add('hide')}).catch(showDetailError)}

Array.prototype.forEach.call(document.querySelectorAll('.navBtn'),function(b){b.onclick=function(){var n=b.getAttribute('data-nav');if(n==='home')homeView();else if(n==='library')libraryView(libraries[0]);else meView()}});

function focusables(){return Array.prototype.slice.call(document.querySelectorAll('button,input,select,[tabindex]')).filter(function(el){if(el.disabled||el.tabIndex<0)return false;var p=el;while(p){if(p.classList&&p.classList.contains('hide'))return false;p=p.parentElement}var r=el.getBoundingClientRect();return r.width>0&&r.height>0})}
function moveFocus(dir){var a=focusables(),c=document.activeElement;if(!a.length)return;if(a.indexOf(c)<0){a[0].focus();return}var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,score=1e12;a.forEach(function(el){if(el===c)return;var x=el.getBoundingClientRect(),ex=x.left+x.width/2,ey=x.top+x.height/2,dx=ex-cx,dy=ey-cy;if((dir==='l'&&dx>=-2)||(dir==='r'&&dx<=2)||(dir==='u'&&dy>=-2)||(dir==='d'&&dy<=2))return;var p=(dir==='l'||dir==='r')?Math.abs(dx):Math.abs(dy),s=(dir==='l'||dir==='r')?Math.abs(dy):Math.abs(dx),sc=p+s*2.1;if(sc<score){score=sc;best=el}});if(best){best.focus();try{best.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){best.scrollIntoView(false)}}}
function remoteKey(e){var k=e.keyCode||e.which;if(k===37||k===38||k===39||k===40){var tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'&&(k===37||k===39))return;e.preventDefault();moveFocus(k===37?'l':k===38?'u':k===39?'r':'d');return}if(k===13){var a=document.activeElement;if(a&&a.click&&a.tagName!=='INPUT'&&a.tagName!=='SELECT'){e.preventDefault();a.click()}return}if(k===10009||e.key==='Backspace'){e.preventDefault();if(!q('player').classList.contains('hide'))closePlayer();else if(!q('detailMenu').classList.contains('hide'))q('detailMenu').classList.add('hide');else if(!q('detail').classList.contains('hide'))backFromDetail();else if(!q('app').classList.contains('hide')&&lastView!=='home')homeView();else if(!q('setup').classList.contains('hide')){try{window.history.back()}catch(x){}}return}if(k===10252&&!q('player').classList.contains('hide'))q('pause').click();else if(k===412&&!q('player').classList.contains('hide'))q('rew').click();else if(k===417&&!q('player').classList.contains('hide'))q('fwd').click()}
window.addEventListener('keydown',remoteKey,true);

loadCfg();
if(cfg.host&&cfg.token){showOnly('setup');rawReq('/v/api/v1/user/info').then(function(){showOnly('app');homeView()}).catch(function(){cfg.token='';localStorage.setItem(LS,JSON.stringify(cfg));showOnly('setup');focusFirst()})}else{showOnly('setup');focusFirst()}
})();
