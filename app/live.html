<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Fygo TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#1d1d1f;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
:focus{outline:none}
.focusable:focus,.posterCard:focus,.libHero:focus,.stat:focus,.navBtn:focus,.roundBtn:focus,.primary:focus,.secondary:focus,input:focus,select:focus{
  box-shadow:0 0 0 4px #1584ff,0 0 28px rgba(21,132,255,.42);
  transform:scale(1.035);z-index:5
}
#setup{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#18181a}
.setupPanel{width:900px;background:#242427;border-radius:28px;padding:46px 54px;box-shadow:0 24px 90px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:18px;font-size:42px;font-style:italic;font-weight:700}
.logoMark{width:54px;height:54px;border-radius:17px 17px 25px 25px;background:#1976e8;position:relative;display:inline-block}
.logoMark:before{content:"";position:absolute;left:13px;top:17px;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.logoMark:after{content:"";position:absolute;left:3px;top:-10px;width:48px;height:12px;border-radius:5px;background:repeating-linear-gradient(110deg,#1976e8 0 10px,transparent 10px 16px)}
.setupSub{margin:15px 0 30px;color:#b9bbc0;font-size:23px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
.field label{display:block;font-size:20px;color:#b9bbc0;margin:0 0 9px}
.field input,.field select{width:100%;height:58px;background:#161618;border:2px solid #414146;border-radius:12px;padding:0 17px}
.actions{display:flex;gap:18px;margin-top:30px}
.primary,.secondary{border:0;border-radius:16px;padding:17px 30px;font-weight:700}
.primary{background:#087dff}.secondary{background:#343438}
.status{margin-top:18px;color:#c7c8cc;min-height:28px}.err{color:#ff6a72}

#app{width:100%;height:100%;background:#1d1d1f}
.topbar{height:112px;display:flex;align-items:center;padding:0 76px;position:relative;z-index:10}
.topbar .logo{font-size:40px}
.searchBtn{margin-left:auto;width:62px;height:62px;border:0;background:transparent;border-radius:50%;position:relative}
.searchBtn:before{content:"";position:absolute;width:29px;height:29px;border:5px solid #fff;border-radius:50%;left:10px;top:8px}
.searchBtn:after{content:"";position:absolute;width:23px;height:5px;background:#fff;transform:rotate(45deg);left:37px;top:40px;border-radius:3px}
.mainScroll{position:absolute;top:112px;bottom:104px;left:0;right:0;overflow-y:auto;padding:12px 76px 52px}
.sectionTitle{font-size:30px;font-weight:700;margin:34px 0 18px;display:flex;align-items:center;gap:12px}
.chev{font-size:38px;color:#d7d7da}
.heroLine{display:flex;gap:30px;align-items:stretch}
.libHero{width:360px;height:190px;border:3px solid #4f5157;background:#292a2e;border-radius:22px;overflow:hidden;padding:0;position:relative;transition:.12s}
.libCollage{height:132px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#111}
.libCollage img{width:100%;height:100%;object-fit:cover}
.libHeroTitle{position:absolute;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(18,18,20,.96) 30%);font-size:28px;font-weight:700}
.stats{display:flex;gap:22px;align-items:stretch;flex:1}
.stat{min-width:240px;max-width:320px;flex:1;height:130px;border:0;border-radius:22px;background:#34363f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.12s}
.stat:nth-child(2){background:#37323f}.stat:nth-child(3){background:#2e3b3d}.stat:nth-child(4){background:#34333d}
.statName{font-size:25px}.statValue{font-size:27px;margin-top:8px;font-weight:700}
.rail{display:flex;gap:22px;overflow-x:auto;overflow-y:visible;padding:8px 4px 22px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.posterCard{flex:0 0 230px;width:230px;border:0;background:transparent;text-align:left;padding:0;transition:.12s;border-radius:16px}
.posterWrap{height:338px;background:#303238;border:1px solid #5a5c62;border-radius:16px;overflow:hidden;position:relative}
.posterWrap img{width:100%;height:100%;object-fit:cover;display:block}
.score{position:absolute;left:9px;top:9px;background:rgba(7,8,9,.80);border-radius:7px;padding:5px 8px;font-size:18px;color:#f4e522}
.badge4k{position:absolute;right:8px;bottom:8px;background:rgba(220,220,220,.83);color:#28282a;border-radius:5px;padding:3px 7px;font-size:17px;font-weight:700}
.cardTitle{font-size:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0 7px}
.cardYear{font-size:21px;color:#b7b8bc}
.empty{color:#aaa;padding:30px 0;font-size:22px}
.bottomNav{position:absolute;left:0;right:0;bottom:0;height:104px;background:#1d1d1f;display:flex;align-items:center;justify-content:center;gap:160px;border-top:1px solid #2c2c2f}
.navBtn{width:180px;height:82px;background:transparent;border:0;border-radius:16px;color:#bfc0c4;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:.12s}
.navBtn.active{color:#fff}.navIcon{font-size:31px;line-height:1}.meCircle{width:35px;height:35px;border-radius:50%;background:#ffb18a;color:#fff;display:flex;align-items:center;justify-content:center}

#detail{position:absolute;inset:0;background:#202023;overflow-y:auto}
.backdrop{height:590px;background:#25262a center/cover no-repeat;position:relative}
.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,28,30,.02) 20%,rgba(28,28,30,.55) 66%,#202023 100%)}
.detailTop{position:absolute;top:36px;left:52px;right:52px;z-index:2;display:flex;justify-content:space-between}
.roundBtn{width:68px;height:68px;border:0;border-radius:50%;background:rgba(35,35,38,.70);font-size:34px}
.detailBody{position:relative;margin-top:-178px;z-index:3;padding:0 76px 70px}
.detailTitle{font-size:54px;font-weight:800;max-width:1100px;margin:0 0 14px}
.meta{font-size:25px;color:#d0d0d3;line-height:1.45;max-width:1250px}
.rating{color:#efd921}
.chips{display:flex;gap:18px;flex-wrap:wrap;margin:28px 0 22px}
.chip{font-size:23px;font-weight:700}
.tech{background:#d1d1d3;color:#272729;border-radius:5px;padding:4px 9px;font-size:21px;font-weight:800}
.progressLine{display:flex;align-items:center;gap:18px;margin:22px 0;max-width:850px}
.progressTrack{height:10px;background:#55565b;border-radius:9px;flex:1;overflow:hidden}
.progressFill{height:100%;background:#087dff;width:0}
.progressText{font-size:22px;color:#c7c7cb}
.detailActions{display:flex;gap:26px;align-items:center;margin:28px 0}
.playBig{min-width:330px;height:84px;border:0;border-radius:48px;background:#087dff;font-size:30px;font-weight:800}
.circleAction{width:82px;height:82px;border-radius:50%;border:1px solid #5c5d62;background:#343438;font-size:33px}
.qualityRow{display:flex;gap:16px;margin:12px 0 30px}
.qualityBtn{background:#36363a;border:0;border-radius:11px;padding:16px 28px;font-size:24px}
.qualityBtn.selected{border:3px solid #087dff;color:#087dff;background:#29292c}
.overview{font-size:25px;color:#d2d2d5;line-height:1.45;max-width:1250px}
.subheading{font-size:29px;font-weight:800;margin:32px 0 18px}

#player{position:absolute;inset:0;background:#000;z-index:30}
#video{width:100%;height:100%;background:#000}
.playerHud{position:absolute;left:0;right:0;bottom:0;padding:80px 70px 45px;background:linear-gradient(transparent,rgba(0,0,0,.92));opacity:1;transition:.25s}
.playerTitle{font-size:30px;font-weight:700;margin-bottom:18px}
.playerControls{display:flex;gap:18px;align-items:center}
.playerControls button{background:#202024;border:0;border-radius:15px;padding:16px 26px}
.playerControls .primary{background:#087dff}
.playerError{color:#ff6a72;font-size:22px;margin:12px 0}
.searchPanel{display:flex;gap:16px;margin:15px 0 30px}
.searchPanel input{width:720px;height:64px;background:#2b2b2f;border:2px solid #48484e;border-radius:15px;padding:0 19px;font-size:26px}
.searchPanel button{height:64px}
.settingsCard{background:#29292d;border-radius:20px;padding:30px;max-width:900px}
</style>
</head>
<body>

<div id="setup">
  <div class="setupPanel">
    <div class="logo"><span class="logoMark"></span><span>Fygo TV</span></div>
    <div class="setupSub">Ligação ao teu FygoOS</div>
    <div class="grid">
      <div class="field"><label>Protocolo</label><select id="protocol"><option>http</option><option>https</option></select></div>
      <div class="field"><label>IP / hostname</label><input id="host" placeholder="NAS"></div>
      <div class="field"><label>Porta</label><input id="port" value="5666"></div>
      <div class="field"><label>Código de acesso (opcional)</label><input id="code"></div>
      <div class="field"><label>Utilizador FygoOS</label><input id="username"></div>
      <div class="field"><label>Palavra-passe</label><input id="password" type="password"></div>
    </div>
    <div class="actions">
      <button id="test" class="secondary focusable">Testar ligação</button>
      <button id="save" class="primary focusable">Guardar e entrar</button>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="topbar">
    <div class="logo"><span class="logoMark"></span><span>Fygo TV</span></div>
    <button id="topSearch" class="searchBtn focusable" aria-label="Pesquisar"></button>
  </div>
  <div id="mainScroll" class="mainScroll"></div>
  <div class="bottomNav">
    <button class="navBtn focusable active" data-nav="home"><span class="navIcon">⌂</span><span>Home</span></button>
    <button class="navBtn focusable" data-nav="library"><span class="navIcon">▭</span><span>Library</span></button>
    <button class="navBtn focusable" data-nav="me"><span class="meCircle">M</span><span>Me</span></button>
  </div>
</div>

<div id="detail" class="hide">
  <div id="detailBackdrop" class="backdrop"></div>
  <div class="detailTop">
    <button id="detailBack" class="roundBtn focusable">←</button>
    <button class="roundBtn focusable">•••</button>
  </div>
  <div class="detailBody">
    <h1 id="detailTitle" class="detailTitle"></h1>
    <div id="detailMeta" class="meta"></div>
    <div id="detailChips" class="chips"></div>
    <div id="detailProgress" class="progressLine hide">
      <div class="progressTrack"><div id="detailProgressFill" class="progressFill"></div></div>
      <div id="detailProgressText" class="progressText"></div>
    </div>
    <div class="detailActions">
      <button id="playBig" class="playBig focusable">▶ Play</button>
      <button class="circleAction focusable">♡</button>
      <button class="circleAction focusable">↓</button>
      <button class="circleAction focusable">◉</button>
    </div>
    <div id="qualityRow" class="qualityRow"><button class="qualityBtn selected focusable">Original</button></div>
    <div id="overview" class="overview"></div>
    <div class="subheading">Cast & Crew</div>
    <div id="castRail" class="rail"><div class="empty">Disponível numa próxima revisão.</div></div>
  </div>
</div>

<div id="player" class="hide">
  <video id="video" playsinline></video>
  <div id="playerHud" class="playerHud">
    <div id="playerTitle" class="playerTitle"></div>
    <div id="playerError" class="playerError"></div>
    <div class="playerControls">
      <button id="rew" class="focusable">−10 s</button>
      <button id="pause" class="primary focusable">Play/Pause</button>
      <button id="fwd" class="focusable">+10 s</button>
      <button id="playerBack" class="focusable">Voltar</button>
    </div>
  </div>
</div>

<script>
(function(){
var ROOT='http://127.0.0.1:8770';
var PROXY=ROOT+'/fygo';
var LS='fygo_tb_cfg_v2';
var DEVLS='fygo_tb_device_v1';
var cfg={},tempPassword='',libraries=[],homeItems=[],currentItem=null,lastView='home';

function q(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pick(o,keys){if(!o)return'';for(var i=0;i<keys.length;i++){if(o[keys[i]]!=null&&o[keys[i]]!=='')return o[keys[i]]}return''}
function number(v){var n=Number(v);return isNaN(n)?0:n}
function deviceId(){var d='';try{d=localStorage.getItem(DEVLS)||''}catch(e){}if(!d){d='tizen-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*0xffffff).toString(36);try{localStorage.setItem(DEVLS,d)}catch(e){}}return d}
function loadCfg(){try{cfg=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){cfg={}};q('protocol').value=cfg.protocol||'http';q('host').value=cfg.host||'';q('port').value=cfg.port||'5666';q('code').value=cfg.code||'';q('username').value=cfg.username||'';q('password').value=''}
function readCfg(){tempPassword=q('password').value;cfg={protocol:q('protocol').value,host:q('host').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,''),port:q('port').value.trim(),code:q('code').value.trim(),username:q('username').value.trim(),token:cfg.token||''};return cfg}
function rawReq(path,opt){opt=opt||{};var method=(opt.method||'GET').toUpperCase();var bodyText=opt.body?JSON.stringify(opt.body):'';var env={protocol:cfg.protocol||'http',host:cfg.host,port:cfg.port,path:path,method:method,bodyText:bodyText,accessCode:cfg.code||'',deviceId:deviceId(),token:opt.noAuth?'':(cfg.token||''),hashPassword:opt.hashPassword===true};return fetch(PROXY,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(env)}).then(function(r){return r.text().then(function(t){var j;try{j=t?JSON.parse(t):{}}catch(e){throw Error('Resposta inválida (HTTP '+r.status+')')}if(!r.ok){var he=Error((j&&j.msg)||('HTTP '+r.status));he.httpStatus=r.status;throw he}if(j&&typeof j.code!=='undefined'&&[0,1,200].indexOf(j.code)<0)throw Error(j.msg||('Código '+j.code));return j&&Object.prototype.hasOwnProperty.call(j,'data')?j.data:j})})}
function req(path,opt){return rawReq(path,opt)}
function saveToken(d){var tok=d&&pick(d,['token','access_token','authorization','auth']);if(!tok&&typeof d==='string')tok=d;if(!tok)throw Error('O FygoOS não devolveu um token de sessão.');cfg.token=String(tok);localStorage.setItem(LS,JSON.stringify(cfg));return tok}
function login(){if(!cfg.username||!tempPassword)return Promise.reject(Error('Introduz utilizador e palavra-passe.'));return rawReq('/v/api/v2/user/loginByPassword',{method:'POST',noAuth:true,hashPassword:true,body:{username:cfg.username,password:tempPassword}}).then(saveToken)}
function status(s,e){q('status').textContent=s;q('status').className='status'+(e?' err':'')}
function connect(enter){readCfg();status('A ligar…');return rawReq('/v/api/v1/server/info',{noAuth:true}).then(function(info){if(!enter){status('Ligação OK');return info}var auth=cfg.token?rawReq('/v/api/v1/user/info').catch(function(){cfg.token='';return login().then(function(){return rawReq('/v/api/v1/user/info')})}):login().then(function(){return rawReq('/v/api/v1/user/info')});return auth.then(function(){localStorage.setItem(LS,JSON.stringify(cfg));status('Autenticação OK');enterApp();return info})}).catch(function(e){status(e.message,true);throw e})}

function assetValue(v){if(!v)return'';if(Array.isArray(v))v=v[0];if(typeof v==='object')v=pick(v,['path','url','src','poster']);if(typeof v==='string'&&(v.charAt(0)==='['||v.charAt(0)==='{')){try{var x=JSON.parse(v);return assetValue(x)}catch(e){}}return String(v||'')}
function posterOf(i){return assetValue(pick(i,['poster','posters','poster_list','cover','thumb']))}
function backdropOf(i){return assetValue(pick(i,['backdrops','backdrop','horizontal_poster','poster','posters']))}
function imageUrl(v,w){v=assetValue(v);return v?ROOT+'/image?src='+encodeURIComponent(v)+'&w='+(w||500):''}
function titleOf(i){return pick(i,['title','tv_title','tvTitle','name','file_name'])||'Sem título'}
function yearOf(i){var v=pick(i,['release_date','releaseDate','air_date','airDate','year']);return v?String(v).slice(0,4):''}
function scoreOf(i){var v=pick(i,['vote_average','voteAverage','score','rating']);var n=parseFloat(v);return isNaN(n)||n<=0?'':n.toFixed(1)}
function guidOf(i){return String(pick(i,['guid','item_guid','itemGuid'])||'')}
function arr(d){if(Array.isArray(d))return d;if(!d)return[];return d.list||d.items||d.data||[]}

function showOnly(id){['setup','app','detail','player'].forEach(function(x){q(x).classList.toggle('hide',x!==id)})}
function setActiveNav(n){Array.prototype.forEach.call(document.querySelectorAll('.navBtn'),function(b){b.classList.toggle('active',b.getAttribute('data-nav')===n)})}
function focusFirst(){setTimeout(function(){var a=focusables();if(a.length)try{a[0].focus()}catch(e){}},80)}
function enterApp(){showOnly('app');homeView()}

function movieCard(i){var p=posterOf(i);var sc=scoreOf(i);return '<button class="posterCard" data-guid="'+esc(guidOf(i))+'"><div class="posterWrap">'+(p?'<img src="'+esc(imageUrl(p,420))+'">':'')+(sc?'<span class="score">'+esc(sc)+'</span>':'')+'<span class="badge4k">4K</span></div><div class="cardTitle">'+esc(titleOf(i))+'</div><div class="cardYear">'+esc(yearOf(i))+'</div></button>'}
function bindCards(){Array.prototype.forEach.call(document.querySelectorAll('.posterCard'),function(b){b.onclick=function(){openDetail(b.getAttribute('data-guid'))}})}
function libraryCollage(items){var a=items.slice(0,3);while(a.length<3)a.push({});return '<div class="libCollage">'+a.map(function(i){var p=posterOf(i);return p?'<img src="'+esc(imageUrl(p,260))+'">':'<div></div>'}).join('')+'</div>'}

function loadItems(lib,limit){var g=lib&&lib.guid||'';return req('/v/api/v1/item/list',{method:'POST',body:{ancestor_guid:g,tags:{type:['Movie','TV','Directory','Video']},exclude_grouped_video:1,sort_type:'DESC',sort_column:'create_time',page_size:limit||30,page:1}}).then(function(d){return arr(d)})}

function homeView(){
  lastView='home';setActiveNav('home');
  q('mainScroll').innerHTML='<div class="empty">A carregar…</div>';
  Promise.all([
    req('/v/api/v1/mediadb/list'),
    req('/v/api/v1/mediadb/sum').catch(function(){return{}}),
    req('/v/api/v1/play/list').catch(function(){return[]})
  ]).then(function(r){
    libraries=arr(r[0]);var sums=r[1]||{};var recent=arr(r[2]);
    var first=libraries[0];
    return (first?loadItems(first,24):Promise.resolve(recent)).catch(function(){return recent}).then(function(items){
      homeItems=items&&items.length?items:recent;
      var all=number(sums.total)||homeItems.length;
      var movies=number(sums.movie);
      var tv=number(sums.tv);
      var videos=number(sums.video);
      var h='<div class="heroLine">';
      if(first){
        h+='<button id="libHero" class="libHero focusable" data-guid="'+esc(first.guid||'')+'">'+libraryCollage(homeItems)+'<div class="libHeroTitle">'+esc(first.title||first.name||'Filmes')+'</div></button>';
      }
      h+='<div class="stats"><button class="stat focusable"><span class="statName">All</span><span class="statValue">'+all+'</span></button><button class="stat focusable"><span class="statName">Movies</span><span class="statValue">'+movies+'</span></button><button class="stat focusable"><span class="statName">TV Shows</span><span class="statValue">'+tv+'</span></button><button class="stat focusable"><span class="statName">Videos</span><span class="statValue">'+videos+'</span></button></div></div>';
      h+='<div class="sectionTitle">'+esc(first&&first.title||'Filmes')+' <span class="chev">›</span></div>';
      h+=homeItems.length?'<div class="rail">'+homeItems.map(movieCard).join('')+'</div>':'<div class="empty">Sem conteúdos.</div>';
      q('mainScroll').innerHTML=h;
      if(q('libHero'))q('libHero').onclick=function(){libraryView(first)};
      bindCards();focusFirst();
    })
  }).catch(function(e){q('mainScroll').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})
}

function libraryView(lib){
  lastView='library';setActiveNav('library');
  q('mainScroll').innerHTML='<div class="sectionTitle">'+esc(lib&&lib.title||'Library')+'</div><div class="empty">A carregar…</div>';
  var p=lib?loadItems(lib,80):Promise.resolve(homeItems);
  p.then(function(items){homeItems=items;var h='<div class="sectionTitle">'+esc(lib&&lib.title||'Library')+'</div><div class="rail" style="flex-wrap:wrap;overflow:visible">'+items.map(movieCard).join('')+'</div>';q('mainScroll').innerHTML=h;bindCards();focusFirst()}).catch(function(e){q('mainScroll').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})
}

function searchView(){
  lastView='search';setActiveNav('');
  q('mainScroll').innerHTML='<div class="sectionTitle">Search</div><div class="searchPanel"><input id="searchInput" class="focusable" placeholder="Filme, série…"><button id="searchGo" class="primary focusable">Pesquisar</button></div><div id="searchResults"></div>';
  q('searchGo').onclick=function(){var term=q('searchInput').value.trim();if(!term)return;q('searchResults').innerHTML='<div class="empty">A procurar…</div>';req('/v/api/v1/search/list?q='+encodeURIComponent(term)).then(function(d){var a=arr(d);q('searchResults').innerHTML=a.length?'<div class="rail" style="flex-wrap:wrap;overflow:visible">'+a.map(movieCard).join('')+'</div>':'<div class="empty">Sem resultados.</div>';bindCards();focusFirst()}).catch(function(e){q('searchResults').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'})};
  setTimeout(function(){q('searchInput').focus()},80)
}

function meView(){
  lastView='me';setActiveNav('me');
  q('mainScroll').innerHTML='<div class="sectionTitle">Me</div><div class="settingsCard"><div style="font-size:27px;font-weight:700;margin-bottom:14px">'+esc(cfg.username||'Utilizador')+'</div><div style="color:#bbb;margin-bottom:25px">'+esc(cfg.host)+':'+esc(cfg.port)+'</div><button id="editServer" class="secondary focusable">Servidor e conta</button></div>';
  q('editServer').onclick=function(){showOnly('setup');loadCfg();focusFirst()};focusFirst()
}

function openDetail(g){
  var found=null;for(var i=0;i<homeItems.length;i++)if(guidOf(homeItems[i])===g){found=homeItems[i];break}
  currentItem=found||{guid:g};
  showOnly('detail');
  renderDetail(currentItem);
  req('/v/api/v1/item/'+encodeURIComponent(g)).then(function(d){currentItem=d||currentItem;renderDetail(currentItem);focusFirst()}).catch(function(){focusFirst()})
}
function renderDetail(i){
  q('detailTitle').textContent=titleOf(i);
  var bp=backdropOf(i);q('detailBackdrop').style.backgroundImage=bp?'url("'+imageUrl(bp,1500)+'")':'none';
  var score=scoreOf(i),year=yearOf(i),country=pick(i,['country','countries','production_countries']),genres=pick(i,['genres','genre']);
  if(Array.isArray(country))country=country.join(' · ');if(Array.isArray(genres))genres=genres.join(' · ');
  var duration=number(pick(i,['duration','runtime']));var dur=duration?Math.max(1,Math.round(duration/60))+'m':'';
  q('detailMeta').innerHTML=(score?'<span class="rating">'+esc(score)+'</span> &nbsp; ':'')+[year,country,genres].filter(Boolean).map(esc).join(' / ')+(dur?'<br>'+esc(dur):'');
  q('overview').textContent=pick(i,['overview','plot','description'])||'';
  q('detailChips').innerHTML='<span class="chip">English Subtitle⌄</span><span class="chip">English Audio⌄</span><span class="tech">4K</span><span class="tech">HDR</span>';
  var ts=number(pick(i,['ts','played_time','progress']));var total=number(pick(i,['duration','runtime']));
  if(ts>0&&total>0){q('detailProgress').classList.remove('hide');q('detailProgressFill').style.width=Math.min(100,ts/total*100)+'%';q('detailProgressText').textContent=Math.max(0,Math.round((total-ts)/60))+'m restantes';q('playBig').textContent='▶ Resume'}else{q('detailProgress').classList.add('hide');q('playBig').textContent='▶ Play'}
}
function returnFromDetail(){showOnly('app');if(lastView==='library')libraryView(libraries[0]);else if(lastView==='search')searchView();else if(lastView==='me')meView();else homeView()}

function mediaGuid(info,i){
  var g=pick(info,['media_guid','mediaGuid','mediaGUID']);
  if(!g&&info&&info.media)g=pick(info.media,['guid','media_guid']);
  if(!g&&info&&Array.isArray(info.medias)&&info.medias.length)g=pick(info.medias[0],['guid','media_guid']);
  if(!g)g=pick(i,['media_guid','mediaGuid','mediaGUID']);
  return String(g||'')
}
function playCurrent(){
  if(!currentItem)return;
  showOnly('player');q('playerTitle').textContent=titleOf(currentItem);q('playerError').textContent='A preparar…';
  var g=guidOf(currentItem);
  req('/v/api/v1/play/info',{method:'POST',body:{item_guid:g}}).then(function(info){
    var mg=mediaGuid(info,currentItem);
    if(!mg)throw Error('O FygoOS não devolveu media_guid.');
    var v=q('video');
    v.src=ROOT+'/media?guid='+encodeURIComponent(mg);
    v.autoplay=true;
    v.load();
    var pr=v.play();
    if(pr&&pr.then)pr.then(function(){q('playerError').textContent=''}).catch(function(e){q('playerError').textContent='Erro do player: '+(e&&e.message?e.message:'não foi possível reproduzir')});
    else q('playerError').textContent='';
  }).catch(function(e){q('playerError').textContent=e.message})
}
function closePlayer(){var v=q('video');try{v.pause();v.removeAttribute('src');v.load()}catch(e){};showOnly('detail');focusFirst()}

q('protocol').onchange=function(){q('port').value=q('protocol').value==='https'?'5667':'5666'};
q('test').onclick=function(){connect(false)};
q('save').onclick=function(){connect(true)};
q('topSearch').onclick=searchView;
q('detailBack').onclick=returnFromDetail;
q('playBig').onclick=playCurrent;
q('playerBack').onclick=closePlayer;
q('pause').onclick=function(){var v=q('video');if(v.paused)v.play();else v.pause()};
q('rew').onclick=function(){q('video').currentTime=Math.max(0,q('video').currentTime-10)};
q('fwd').onclick=function(){q('video').currentTime+=10};
q('video').onerror=function(){var c=q('video').error&&q('video').error.code;q('playerError').textContent='Erro de reprodução'+(c?' (código '+c+')':'')};

Array.prototype.forEach.call(document.querySelectorAll('.navBtn'),function(b){b.onclick=function(){var n=b.getAttribute('data-nav');if(n==='home')homeView();else if(n==='library')libraryView(libraries[0]);else meView()}});

function focusables(){return Array.prototype.slice.call(document.querySelectorAll('button,input,select,[tabindex]')).filter(function(el){if(el.disabled||el.tabIndex<0)return false;var p=el;while(p){if(p.classList&&p.classList.contains('hide'))return false;p=p.parentElement}var r=el.getBoundingClientRect();return r.width>0&&r.height>0})}
function moveFocus(dir){var a=focusables(),c=document.activeElement;if(!a.length)return;if(a.indexOf(c)<0){a[0].focus();return}var r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,score=1e12;a.forEach(function(el){if(el===c)return;var x=el.getBoundingClientRect(),ex=x.left+x.width/2,ey=x.top+x.height/2,dx=ex-cx,dy=ey-cy;if((dir==='l'&&dx>=-2)||(dir==='r'&&dx<=2)||(dir==='u'&&dy>=-2)||(dir==='d'&&dy<=2))return;var primary=(dir==='l'||dir==='r')?Math.abs(dx):Math.abs(dy),secondary=(dir==='l'||dir==='r')?Math.abs(dy):Math.abs(dx),sc=primary+secondary*2.15;if(sc<score){score=sc;best=el}});if(best){best.focus();try{best.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){best.scrollIntoView(false)}}}
function remoteKey(e){var k=e.keyCode||e.which;if(k===37||k===38||k===39||k===40){var tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'&&(k===37||k===39))return;e.preventDefault();moveFocus(k===37?'l':k===38?'u':k===39?'r':'d');return}if(k===13){var a=document.activeElement;if(a&&a.click&&a.tagName!=='INPUT'&&a.tagName!=='SELECT'){e.preventDefault();a.click()}return}if(k===10009||e.key==='Backspace'){e.preventDefault();if(!q('player').classList.contains('hide'))closePlayer();else if(!q('detail').classList.contains('hide'))returnFromDetail();else if(!q('app').classList.contains('hide')&&lastView!=='home')homeView();else if(!q('setup').classList.contains('hide')){try{window.history.back()}catch(x){}}return}if(k===10252&&!q('player').classList.contains('hide'))q('pause').click();else if(k===412&&!q('player').classList.contains('hide'))q('rew').click();else if(k===417&&!q('player').classList.contains('hide'))q('fwd').click()}
window.addEventListener('keydown',remoteKey,true);

loadCfg();
if(cfg.host&&cfg.token){showOnly('setup');rawReq('/v/api/v1/user/info').then(function(){enterApp()}).catch(function(){cfg.token='';localStorage.setItem(LS,JSON.stringify(cfg));showOnly('setup');focusFirst()})}else{showOnly('setup');focusFirst()}
})();
</script>
</body>
</html>
